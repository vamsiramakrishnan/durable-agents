<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title>Seq Alignment on Re-drive</title>
  <desc>Seq Alignment on Re-drive — the re-driven agent's stream of RecordDecision and BeginEffect calls matches the recorded seq stream until the first gap, which is the resume point.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#486A8F"/></marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 33px ui-serif, Georgia, serif; fill: #1f1f1f; }
      .subtitle { font: 400 18px ui-serif, Georgia, serif; fill: #686868; }
      .label { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .small { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .tiny { font: 400 12.5px ui-sans-serif, system-ui, sans-serif; fill: #686868; }
      .mono { font: 600 13px ui-monospace, Menlo, Consolas, monospace; fill: #1f1f1f; }
      .box { fill: #fffefa; stroke: #1f1f1f; stroke-width: 1.5; }
      .blue { fill: #E8EEF5; stroke: #486A8F; stroke-width: 1.7; }
      .green { fill: #E5EFE8; stroke: #4E745B; stroke-width: 1.7; }
      .red { fill: #F2DEDE; stroke: #8A3C3C; stroke-width: 1.7; }
      .soft { fill: #EAE7DF; stroke: #1f1f1f; stroke-width: 1.2; }
      .gap { fill: #fff; stroke: #8A3C3C; stroke-width: 1.7; stroke-dasharray: 6 5; }
      .line { stroke: #1f1f1f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .matchln { stroke: #486A8F; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text x="60" y="62" class="title">Seq Alignment on Re-drive</text>
  <text x="60" y="92" class="subtitle">The k-th call matches recorded seq=k. The first call with no record is the resume point.</text>

  <!-- recorded journal -->
  <text x="60" y="160" class="label">Recorded journal  (from the run that crashed)</text>
  <rect x="60" y="175" width="150" height="56" rx="10" class="blue"/><text x="135" y="200" class="mono" text-anchor="middle">seq 1</text><text x="135" y="220" class="tiny" text-anchor="middle">decision: plan</text>
  <rect x="230" y="175" width="150" height="56" rx="10" class="green"/><text x="305" y="200" class="mono" text-anchor="middle">seq 2</text><text x="305" y="220" class="tiny" text-anchor="middle">effect: read · ok</text>
  <rect x="400" y="175" width="150" height="56" rx="10" class="blue"/><text x="475" y="200" class="mono" text-anchor="middle">seq 3</text><text x="475" y="220" class="tiny" text-anchor="middle">decision: sweep £2M</text>
  <rect x="570" y="175" width="150" height="56" rx="10" class="green"/><text x="645" y="200" class="mono" text-anchor="middle">seq 4</text><text x="645" y="220" class="tiny" text-anchor="middle">effect: wire · confirmed</text>
  <rect x="740" y="175" width="150" height="56" rx="10" class="gap"/><text x="815" y="200" class="mono" text-anchor="middle">seq 5</text><text x="815" y="220" class="tiny" text-anchor="middle" fill="#8A3C3C">— no record —</text>
  <rect x="910" y="175" width="150" height="56" rx="10" class="gap"/><text x="985" y="200" class="mono" text-anchor="middle">seq 6</text><text x="985" y="220" class="tiny" text-anchor="middle" fill="#8A3C3C">— no record —</text>

  <!-- re-drive stream -->
  <text x="60" y="345" class="label">Re-driven agent  (ADK, same invocation_id)</text>
  <rect x="60" y="360" width="150" height="56" rx="10" class="box"/><text x="135" y="383" class="tiny" text-anchor="middle">model call #1</text><text x="135" y="402" class="tiny" text-anchor="middle">→ GetDecision(1)</text>
  <rect x="230" y="360" width="150" height="56" rx="10" class="box"/><text x="305" y="383" class="tiny" text-anchor="middle">tool call #1</text><text x="305" y="402" class="tiny" text-anchor="middle">→ GetEffect(2)</text>
  <rect x="400" y="360" width="150" height="56" rx="10" class="box"/><text x="475" y="383" class="tiny" text-anchor="middle">model call #2</text><text x="475" y="402" class="tiny" text-anchor="middle">→ GetDecision(3)</text>
  <rect x="570" y="360" width="150" height="56" rx="10" class="box"/><text x="645" y="383" class="tiny" text-anchor="middle">tool call #2</text><text x="645" y="402" class="tiny" text-anchor="middle">→ GetEffect(4)</text>
  <rect x="740" y="360" width="150" height="56" rx="10" class="red"/><text x="815" y="383" class="tiny" text-anchor="middle" fill="#8A3C3C">model call #3</text><text x="815" y="402" class="tiny" text-anchor="middle" fill="#8A3C3C">→ real call</text>
  <rect x="910" y="360" width="150" height="56" rx="10" class="red"/><text x="985" y="383" class="tiny" text-anchor="middle" fill="#8A3C3C">tool call #3</text><text x="985" y="402" class="tiny" text-anchor="middle" fill="#8A3C3C">→ runs for real</text>

  <path d="M135,360 L135,231" class="matchln"/>
  <path d="M305,360 L305,231" class="matchln"/>
  <path d="M475,360 L475,231" class="matchln"/>
  <path d="M645,360 L645,231" class="matchln"/>
  <path d="M815,360 L815,231" class="matchln" stroke="#8A3C3C"/>

  <text x="385" y="270" class="tiny" text-anchor="middle" fill="#486A8F">replayed — short-circuited, no model call, no money moved</text>
  <text x="900" y="270" class="tiny" text-anchor="middle" fill="#8A3C3C">→ the resume point: from here, everything is for real ←</text>

  <rect x="740" y="470" width="320" height="44" rx="10" class="red"/>
  <text x="900" y="498" class="small" text-anchor="middle" fill="#8A3C3C">if seq 4 (the wire) had been "pending" not "confirmed":</text>

  <rect x="60" y="540" width="1080" height="56" rx="12" class="soft"/>
  <text x="600" y="566" class="label" text-anchor="middle">…the body would re-run — but with the same idempotency_key passed to the bank, so the bank dedupes.</text>
  <text x="600" y="586" class="tiny" text-anchor="middle">DBOS's recovery model, expressed through ADK's before_model / before_tool callbacks.</text>
</svg>
