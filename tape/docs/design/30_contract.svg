<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title>An Agent Is a Contract With the World</title>
  <desc>The agent and the world exchange commitments; the runtime sits between them as the journal both sides can point to; an auditor reconstructs what happened.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <style>
      .bg{fill:#fbfaf7}
      .title{font:700 34px ui-serif,Georgia,serif;fill:#1f1f1f}
      .subtitle{font:400 18px ui-serif,Georgia,serif;fill:#686868}
      .label{font:700 18px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .small{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#404040}
      .tiny{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#686868}
      .epi{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .agent{fill:#E8EEF5;stroke:#486A8F;stroke-width:2;rx:18}
      .world{fill:#fffefa;stroke:#1f1f1f;stroke-width:1.8;rx:18}
      .runtime{fill:#E5EFE8;stroke:#4E745B;stroke-width:2;rx:16}
      .aud{fill:#F4E7D8;stroke:#A36A28;stroke-width:1.7;rx:14}
      .line{stroke:#1f1f1f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .line2{stroke:#1f1f1f;stroke-width:2.4;fill:none;marker-end:url(#arrow);marker-start:url(#arrow)}
      .green{stroke:#4E745B;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560"/>
  <text x="60" y="58" class="title">An Agent Is a Contract With the World</text>
  <text x="60" y="88" class="subtitle">The runtime is what keeps the contract honest.</text>

  <!-- agent -->
  <rect x="120" y="190" width="240" height="110" class="agent"/><text x="240" y="240" class="label" text-anchor="middle">AGENT</text><text x="240" y="266" class="tiny" text-anchor="middle">an LLM choosing actions</text>
  <!-- world -->
  <rect x="840" y="170" width="280" height="150" class="world"/><text x="980" y="206" class="label" text-anchor="middle">THE WORLD</text><text x="980" y="232" class="small" text-anchor="middle">the merchant's inventory ·</text><text x="980" y="252" class="small" text-anchor="middle">the airline's seat map ·</text><text x="980" y="272" class="small" text-anchor="middle">the custodian's order book ·</text><text x="980" y="292" class="small" text-anchor="middle">the market, the warehouse</text>
  <!-- commitments both ways -->
  <path d="M360,232 L838,232" class="line2"/><text x="600" y="222" class="small" text-anchor="middle">commitments — placed, honoured, agreed-or-not</text>

  <!-- runtime -->
  <rect x="280" y="380" width="640" height="84" class="runtime"/><text x="600" y="412" class="label" text-anchor="middle">DURABLE EXECUTION RUNTIME</text><text x="600" y="436" class="small" text-anchor="middle">the journal both sides can point to — every decision, every effect, the why, in order</text><text x="600" y="454" class="tiny" text-anchor="middle">timers · signals · replay · suspend across deploys and days</text>
  <path d="M240,300 C240,340 320,378 360,388" class="green"/><text x="290" y="350" class="tiny">decisions · effects · why</text>
  <path d="M980,320 C980,350 900,378 870,386" class="green"/><text x="950" y="350" class="tiny">outcomes recorded</text>

  <!-- auditor -->
  <rect x="500" y="490" width="200" height="44" class="aud"/><text x="600" y="518" class="label" text-anchor="middle">auditor · the user</text>
  <path d="M600,464 L600,488" class="line"/><text x="612" y="480" class="tiny">reconstruct exactly what happened</text>

  <!-- epigraph corners -->
  <text x="60" y="150" class="epi">The chatbot was forgiven for forgetting.</text>
  <text x="1140" y="150" class="epi" text-anchor="end">The agent will not be.</text>
</svg>
