<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title>Replay Is Not One Thing</title>
  <desc>Replay Is Not One Thing — diagram for durable agent execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#486A8F" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8A3C3C" />
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px ui-serif, Georgia, serif; fill: #1f1f1f; }
      .subtitle { font: 400 18px ui-serif, Georgia, serif; fill: #686868; }
      .label { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
      .small { font: 400 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
      .tiny { font: 400 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #686868; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f1f1f; }
      .box { fill: #fffefa; stroke: #1f1f1f; stroke-width: 1.6; rx: 18; }
      .soft { fill: #EAE7DF; stroke: #1f1f1f; stroke-width: 1.3; rx: 16; }
      .blue { fill: #E8EEF5; stroke: #486A8F; stroke-width: 1.7; rx: 18; }
      .amber { fill: #F4E7D8; stroke: #A36A28; stroke-width: 1.7; rx: 18; }
      .red { fill: #F2DEDE; stroke: #8A3C3C; stroke-width: 1.7; rx: 18; }
      .green { fill: #E5EFE8; stroke: #4E745B; stroke-width: 1.7; rx: 18; }
      .line { stroke: #1f1f1f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-blue { stroke: #486A8F; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #8A3C3C; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #686868; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; }
      .thin { stroke: #686868; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="675"/>
<text x="60" y="68" class="title" text-anchor="start">Replay Is Not One Thing</text>
<text x="60" y="100" class="subtitle" text-anchor="start">Different agents need different recovery semantics.</text>
<rect x="80" y="170" width="1040" height="72" fill="#E5EFE8" stroke="#4E745B" stroke-width="1.6" rx="16"/>
<text x="110" y="201" class="label" text-anchor="start">Payments</text>
<text x="380" y="201" class="label" text-anchor="start">deterministic replay</text>
<text x="380" y="225" class="tiny" text-anchor="start">skip completed effects; resume unfinished mutation</text>
<path d="M285,206 L350,206" class="line-blue"/>
<rect x="80" y="262" width="1040" height="72" fill="#F4E7D8" stroke="#A36A28" stroke-width="1.6" rx="16"/>
<text x="110" y="293" class="label" text-anchor="start">Browser</text>
<text x="380" y="293" class="label" text-anchor="start">state re-verification</text>
<text x="380" y="317" class="tiny" text-anchor="start">check page still matches intended action</text>
<path d="M285,298 L350,298" class="line-blue"/>
<rect x="80" y="354" width="1040" height="72" fill="#E8EEF5" stroke="#486A8F" stroke-width="1.6" rx="16"/>
<text x="110" y="385" class="label" text-anchor="start">Coding</text>
<text x="380" y="385" class="label" text-anchor="start">workspace restoration</text>
<text x="380" y="409" class="tiny" text-anchor="start">restore repo, diffs, tests, failed hypotheses</text>
<path d="M285,390 L350,390" class="line-blue"/>
<rect x="80" y="446" width="1040" height="72" fill="#F0E7F5" stroke="#74508C" stroke-width="1.6" rx="16"/>
<text x="110" y="477" class="label" text-anchor="start">Research</text>
<text x="380" y="477" class="label" text-anchor="start">search-tree continuation</text>
<text x="380" y="501" class="tiny" text-anchor="start">resume branches and provenance, not the web</text>
<path d="M285,482 L350,482" class="line-blue"/>
<rect x="80" y="538" width="1040" height="72" fill="#F2DEDE" stroke="#8A3C3C" stroke-width="1.6" rx="16"/>
<text x="110" y="569" class="label" text-anchor="start">Support</text>
<text x="380" y="569" class="label" text-anchor="start">commitment reconstruction</text>
<text x="380" y="593" class="tiny" text-anchor="start">remember promises as structured obligations</text>
<path d="M285,574 L350,574" class="line-blue"/>
<rect x="240" y="615" width="720" height="40" class="soft"/>
<text x="600" y="641" class="label" text-anchor="middle">A runtime should declare what replay means before the crash teaches it.</text>
</svg>
