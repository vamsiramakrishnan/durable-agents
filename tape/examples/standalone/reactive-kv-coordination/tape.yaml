apiVersion: tape.dev/v1
kind: TapeProject
project: { name: reactive-kv-coordination, environment: dev }
agent:
  framework: adk
  app_name: kv
  entrypoint: app.agent:root_agent
  runner_factory: app.agent:build_runner
  deployment_target: local
tape:
  url: ${TAPE_URL:-tape://localhost:7878}
  store: { kind: sqlite, url: sqlite:./.tape/dev.db }
  events: { kind: none }
  reactors:
    recovery: {enabled: true}
    reconciler: {enabled: true}
    outbox: {enabled: false}
    timers: {enabled: true}
    compensation: {enabled: false}
gcp: { project_id: "", region: us-central1 }
tenancy: { mode: single, tenant_id: default }
