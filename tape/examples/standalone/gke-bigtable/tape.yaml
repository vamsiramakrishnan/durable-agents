apiVersion: tape.dev/v1
kind: TapeProject
project:
  name: gke-bigtable
  environment: prod
agent:
  framework: adk
  app_name: gke-bigtable
  entrypoint: app.agent:root_agent
  runner_factory: app.agent:build_runner
  deployment_target: gke
tape:
  url: ${TAPE_URL:-tape://localhost:7878}
  server:
    image: ${TAPE_SERVER_IMAGE:-ghcr.io/vamsiramakrishnan/tape-server:latest}
    target: gke
    min_instances: 3
    max_instances: 20
    cpu: "1"
    memory: "512Mi"
  store:
    kind: bigtable
    url: bigtable://${GOOGLE_CLOUD_PROJECT}/tape/tape
  events:
    kind: pubsub
    topic: tape-events
  reactors:
    recovery: {enabled: true}
    reconciler: {enabled: true}
    outbox: {enabled: true}
    timers: {enabled: true}
    compensation: {enabled: true}
gcp:
  project_id: ${GOOGLE_CLOUD_PROJECT}
  region: us-central1
  artifact_registry_repository: tape
  service_account_prefix: tape
tenancy:
  mode: single
  tenant_id: default
