# Local Tape stack: Postgres + the Tape server.
#
#   docker compose up --build
#
# (The v1 reference server's working store is SQLite; the Postgres service here
# is for the production store path and for `psql` poking. To run the server
# against SQLite only — the default — you don't need this file at all; just
# `cargo run -- --db ./tape.db`.)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tape
      POSTGRES_PASSWORD: tape
      POSTGRES_DB: tape
    ports:
      - "5432:5432"
    volumes:
      - tape-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tape"]
      interval: 2s
      timeout: 3s
      retries: 20

  tape-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["tape-server", "--listen", "0.0.0.0:7878", "--db", "/data/tape.db"]
    environment:
      RUST_LOG: tape_server=info
    ports:
      - "7878:7878"
    volumes:
      - tape-data:/data

volumes:
  tape-pg:
  tape-data:
