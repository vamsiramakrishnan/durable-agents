[package]
name = "tape-server"
version = "0.1.0"
edition = "2021"
description = "Tape — a durable-execution substrate for ADK agents (server)"
license = "Apache-2.0"

[[bin]]
name = "tape-server"
path = "src/main.rs"

[features]
default = []
# `chaos` turns the `fail::fail_point!` sites in `service.rs` from no-ops
# into active injection points. See `design-principles/chaos.md` and
# `server/src/chaos.rs`. Zero-cost when off — the macro compiles to nothing.
chaos = ["fail/failpoints"]
# `sim` activates the Madsim DST test module (`src/sim.rs`). Tests under
# this feature use madsim's deterministic runtime + virtualised time — the
# scenarios single-thread DST can't reach (lease expiry races, adversarial
# scheduling, concurrent recovery). Phase 2.5 of TapeChaos. See
# `design-principles/chaos.md §9`.
sim = []

[dependencies]
tonic = "0.12"
fail = { version = "0.5", default-features = false }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
# pooled, pluggable stores
r2d2 = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2_sqlite = "0.25"
postgres = "0.19"
r2d2_postgres = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
# CEL evaluator for reaction predicates (sandboxed, serializable, fast).
cel-interpreter = { version = "0.10", features = ["json"] }
# Direct tokio-postgres for LISTEN/NOTIFY on the event-bus wake-up path.
tokio-postgres = "0.7"
futures-util = "0.3"
# Cloud Bigtable backend (ring TLS — lighter to build; the emulator path is plaintext).
bigtable_rs = { version = "0.3", default-features = false, features = ["tonic-tls-ring"] }
googleapis-tonic-google-bigtable-v2 = "0.36"

[build-dependencies]
tonic-build = "0.12"

# Deterministic simulation testing — Phase 2.5 of TapeChaos. Madsim provides
# a tokio-compatible deterministic runtime with virtualised time and seeded
# scheduling; we exercise it via `cargo test --features sim` (plus
# `RUSTFLAGS='--cfg madsim'` to flip the simulator on — without that flag
# madsim is a tokio passthrough, the tests still run, but you get neither
# virtualised time nor deterministic scheduling). Dev-only — the production
# binary is unaffected.
[dev-dependencies]
madsim = { version = "0.2", features = ["macros"] }

[profile.release]
opt-level = 2
