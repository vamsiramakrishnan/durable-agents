[package]
name = "tape-server"
version = "0.1.0"
edition = "2021"
description = "Tape — a durable-execution substrate for ADK agents (server)"
license = "Apache-2.0"

[[bin]]
name = "tape-server"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 2
