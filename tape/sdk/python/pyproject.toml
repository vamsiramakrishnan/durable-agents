[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tape-py"
version = "0.1.0"
description = "Tape — a durable-execution substrate for ADK agents (Python SDK & ADK adapter)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
  # google-adk 2.x removed the plugin callback hooks `TapePlugin` rides
  # (`after_run_callback` no longer fires, so `EndRun(TERMINAL)` never
  # lands and resume re-drives effects with fresh ids). Holding at 1.x
  # until the plugin is ported to 2.x. tape-adk (embedded) is unaffected.
  "google-adk>=1.30,<3.0",
]

[project.optional-dependencies]
# `hypothesis` powers the property-based stateful runner in
# tape/tests/test_chaos_stateful.py — see Phase 5.5 in
# design-principles/chaos.md. Skipped at runtime if absent.
dev = ["grpcio-tools>=1.60", "pytest>=7", "pytest-asyncio>=0.23", "hypothesis>=6.100"]
# Pub/Sub connector (used by tape.connectors.pubsub.PubSubConnector); the
# import is lazy, so most users don't need it. Install with `pip install
# tape-py[gcp-pubsub]` to publish effects via Pub/Sub from the outbox reactor.
gcp-pubsub = ["google-cloud-pubsub>=2.21"]

[project.scripts]
tape = "tape._launcher:main"
tape-reactors = "tape.reactors:_main"
# The outbox dispatcher — runs in its own process, loads connectors at startup
# via --load module:attr, and drives PENDING + OUTBOX effects to confirmed /
# failed / unknown via those connectors.
tape-outbox = "tape.reactors.outbox:_main"
# Pull-subscriber for the Pub/Sub side of the outbox. Use --handler module:attr
# to supply your worker (a (payload, attrs) -> DispatchResult callable).
tape-pubsub-sub = "tape.connectors.pubsub:_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tape*"]

[tool.setuptools.package-data]
"tape._gen" = ["*.py"]
