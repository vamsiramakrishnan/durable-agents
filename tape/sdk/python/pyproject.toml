[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tape-py"
version = "0.1.0"
description = "Tape — a durable-execution substrate for ADK agents (Python SDK & ADK adapter)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
  "google-adk>=1.30",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.60", "pytest>=7"]

[project.scripts]
tape = "tape._launcher:main"
tape-reactors = "tape.reactors:_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tape*"]

[tool.setuptools.package-data]
"tape._gen" = ["*.py"]
