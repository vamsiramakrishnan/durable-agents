// Tape — the wire contract.
//
// A durable-execution substrate for ADK agents. See ../../design-principles/tape.md.
//
// Flexible payloads (model requests/responses, tool args/results, event content,
// state values, compensation payloads) are carried as JSON strings. This keeps
// the contract small and the cross-language SDKs honest: the server treats them
// as opaque blobs; only the agent's own code interprets them.
//
// Every mutating RPC carries (run_id, seq) — or, for BeginEffect, (run_id,
// decision_seq, attempt) — and is idempotent: replaying it returns the recorded
// result instead of acting twice. That is what makes the SDK and the recovery
// loop safe to retry freely.

syntax = "proto3";

package tape.v1;

// Language-specific code-generation options (no-op for the other languages).
option java_package = "dev.tape.proto";
option java_multiple_files = true;
option java_outer_classname = "TapeProto";
option go_package = "github.com/vamsiramakrishnan/durable-agents/tape/sdk/go/tapepb;tapepb";

service Tape {
  // ── run lifecycle ─────────────────────────────────────────────────────────
  rpc BeginRun        (BeginRunRequest)        returns (BeginRunResponse);
  rpc ResumeRun       (ResumeRunRequest)       returns (ResumeRunResponse);
  rpc EndRun          (EndRunRequest)          returns (EndRunResponse);
  rpc GetRun          (GetRunRequest)          returns (RunState);
  rpc ListRunsToRecover (ListRunsToRecoverRequest) returns (ListRunsToRecoverResponse);
  rpc SubscribeRun    (SubscribeRunRequest)    returns (stream JournalEntry);

  // ── decision ledger ───────────────────────────────────────────────────────
  rpc RecordDecision  (RecordDecisionRequest)  returns (DecisionRecord);
  rpc GetDecision     (GetDecisionRequest)     returns (GetDecisionResponse);   // re-drive replay

  // ── effect ledger ─────────────────────────────────────────────────────────
  rpc BeginEffect     (BeginEffectRequest)     returns (BeginEffectResponse);   // writes pending, commits, returns key
  rpc CompleteEffect  (CompleteEffectRequest)  returns (EffectRecord);
  rpc GetEffect       (GetEffectRequest)       returns (GetEffectResponse);      // re-drive short-circuit
  rpc ReconcileEffect (ReconcileEffectRequest) returns (EffectRecord);

  // ── outbox dispatch (the GCP-native hardening: for non-idempotent upstreams,
  //    intent and dispatch live in separate processes; the tool body records
  //    intent, the outbox reactor dispatches via a connector, the reconciler
  //    resolves UNKNOWN ambiguity by asking the counterparty) ────────────────
  rpc ListEffectsToDispatch    (ListEffectsToDispatchRequest)    returns (ListEffectsToDispatchResponse);
  rpc ClaimEffectDispatch      (ClaimEffectDispatchRequest)      returns (ClaimEffectDispatchResponse);   // CAS lease
  rpc RecordDispatchAttempt    (RecordDispatchAttemptRequest)    returns (EffectRecord);                  // backoff or → UNKNOWN
  rpc RecordExternalObservation(RecordExternalObservationRequest) returns (EffectRecord);                 // reconciler asks counterparty

  // ── obligations / compensation ────────────────────────────────────────────
  rpc RegisterCompensation     (RegisterCompensationRequest)     returns (ObligationRecord);
  rpc ListObligations          (ListObligationsRequest)          returns (ListObligationsResponse); // LIFO, per-run
  rpc ResolveObligation        (ResolveObligationRequest)        returns (ObligationRecord);
  // The drainer surface — for the obligations reactor and operator queries.
  rpc ListUnresolvedObligations (ListUnresolvedObligationsRequest) returns (ListUnresolvedObligationsResponse); // cross-run
  rpc ClaimObligation          (ClaimObligationRequest)          returns (ClaimObligationResponse);  // atomic lease
  rpc RecordObligationAttempt  (RecordObligationAttemptRequest)  returns (ObligationRecord);          // failure with backoff

  // ── budget ────────────────────────────────────────────────────────────────
  rpc SetBudget       (SetBudgetRequest)       returns (BudgetState);
  rpc AdmitBudget     (AdmitBudgetRequest)     returns (AdmitBudgetResponse);    // refuse if over
  rpc ChargeBudget    (ChargeBudgetRequest)    returns (BudgetState);

  // ── gates / signals ───────────────────────────────────────────────────────
  rpc AwaitSignal     (AwaitSignalRequest)     returns (AwaitSignalResponse);    // parks the run, or returns a delivered signal
  rpc SendSignal      (SendSignalRequest)      returns (SendSignalResponse);     // resumes a waiting run

  // ── reconciliation ────────────────────────────────────────────────────────
  rpc ListPendingEffects (ListPendingEffectsRequest) returns (ListPendingEffectsResponse); // PENDING/UNKNOWN effects, for the reconciler reactor

  // ── timers (the delayed-reactor / gate-timeout service) ───────────────────
  rpc SetTimer        (SetTimerRequest)        returns (TimerRecord);              // idempotent on (run_id, timer_id)
  rpc CancelTimer     (CancelTimerRequest)     returns (CancelTimerResponse);
  rpc ListDueTimers   (ListDueTimersRequest)   returns (ListDueTimersResponse);    // claim=true => atomically mark fired

  // ── the WAL → reactors feed (cross-run journal tail) ──────────────────────
  // The legacy cross-run journal stream; preserved for back-compat.
  // `SubscribeEventsRequest` now also accepts `from_global_seq` and
  // `subject_pattern`; pass them instead of `from_ts_ms` for new code.
  rpc SubscribeEvents    (SubscribeEventsRequest)    returns (stream EventEntry);
  // The subject-routed, global-seq-cursored bus. Path-style subjects with
  // `*` (one segment) / `**` (rest) wildcards; optional CEL predicate.
  rpc SubscribeBySubject (SubscribeBySubjectRequest) returns (stream EventEntry);

  // ── reactions & tasks (the event-bus surface; see design-principles/tape-event-bus.md) ─
  // Reactions are server-side subscriptions: a subject pattern + optional CEL
  // predicate + a handler kind (agent | task | publish) + back-pressure config.
  // Matching journal entries become `tape_tasks` rows that dispatchers claim,
  // run, and complete/nack.
  rpc RegisterReaction   (Reaction)                  returns (Reaction);
  rpc DeregisterReaction (DeregisterReactionRequest) returns (DeregisterReactionResponse);
  rpc ListReactions      (ListReactionsRequest)      returns (ListReactionsResponse);
  rpc ClaimTasks         (ClaimTasksRequest)         returns (ClaimTasksResponse);
  rpc CompleteTask       (CompleteTaskRequest)       returns (CompleteTaskResponse);
  rpc NackTask           (NackTaskRequest)           returns (NackTaskResponse);
  rpc ListTasks          (ListTasksRequest)          returns (ListTasksResponse);

  // ── reactive key-value store (the "X : X (70 → 90)" surface) ──────────────
  // Coordination through journaled state, not messages (treatise §IX ⑥).
  // Writes are atomic and versioned; WatchValue streams the current value plus
  // every change (with the prior value, so subscribers see the transition).
  rpc WriteValue   (WriteValueRequest)   returns (ValueRecord);
  rpc GetValue     (GetValueRequest)     returns (GetValueResponse);
  rpc WatchValue   (WatchValueRequest)   returns (stream ValueEvent);
  rpc DeleteValue  (DeleteValueRequest)  returns (DeleteValueResponse);

  // ── ADK SessionService shim ───────────────────────────────────────────────
  rpc CreateSession   (CreateSessionRequest)   returns (Session);
  rpc GetSession      (GetSessionRequest)      returns (GetSessionResponse);
  rpc ListSessions    (ListSessionsRequest)    returns (ListSessionsResponse);
  rpc DeleteSession   (DeleteSessionRequest)   returns (DeleteSessionResponse);
  rpc AppendEvent     (AppendEventRequest)     returns (AppendEventResponse);    // event + state_delta + tape projections, ONE txn
}

// ── run lifecycle ───────────────────────────────────────────────────────────

message BeginRunRequest {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;
  string invocation_id = 4;
  string lease_owner = 5;       // who is driving this run right now
  int64  lease_ttl_ms = 6;

  // Identity & authorization context. Populated by AIPlex-managed deployments
  // (via the AIPLEX_* env vars, threaded through `tape.adk.identity.from_env()`)
  // and by anyone else who wants their runs to be queryable by tenant / agent /
  // principal in the run timeline. Tape does not depend on AIPlex — these are
  // generic fields with conventional AIPlex env-var population.
  string tenant_id           = 20;  // tenant identifier (AIPlex tenant, organisation, …)
  string actor               = 21;  // SPIFFE-style workload identity ("who is acting")
  string subject             = 22;  // human principal label, distinct from ADK's user_id
                                    //   (e.g. "spiffe://.../user/alice", an OIDC sub, etc.)
  string agent_id            = 23;  // stable agent kind id (the AIPlex catalog id)
  string aiplex_instance_id  = 24;  // AIPlex Instance.ID — joins back to AIPlex's deploy record
  string gateway_route       = 25;  // the gateway route this run came in on
  repeated string scopes     = 26;  // authorized scopes (e.g. "mcp:tools:bank_wire")
  map<string, string> labels = 27;  // free-form key/value labels (aiplex.plane, …)
}
message BeginRunResponse {
  string run_id = 1;
  bool   resumed = 2;           // true => a run with this invocation_id already existed
  int64  next_seq = 3;          // the seq the re-drive should expect to reach next (0 if fresh)
  RunStatus status = 4;
}

message ResumeRunRequest {
  string run_id = 1;
  string lease_owner = 2;
  int64  lease_ttl_ms = 3;
}
message ResumeRunResponse {
  RunState run = 1;
}

message EndRunRequest {
  string run_id = 1;
  RunStatus status = 2;         // TERMINAL | FAILED | STUCK
  string detail_json = 3;
}
message EndRunResponse { RunState run = 1; }

message GetRunRequest { string run_id = 1; }

message ListRunsToRecoverRequest {
  int64 limit = 1;
  int64 now_ms = 2;
}
message ListRunsToRecoverResponse {
  repeated RunState runs = 1;
}

message SubscribeRunRequest {
  string run_id = 1;
  int64  from_seq = 2;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNABLE = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_WAITING = 3;       // parked on a gate
  RUN_STATUS_TERMINAL = 4;      // completed normally
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_COMPENSATING = 6;
  RUN_STATUS_STUCK = 7;         // a compensation failed; needs a human
  RUN_STATUS_CANCELLED = 8;     // cancelled explicitly (cooperative: agent checks at the next model/tool boundary)
}

message RunState {
  string run_id = 1;
  string app_name = 2;
  string user_id = 3;
  string session_id = 4;
  string invocation_id = 5;
  RunStatus status = 6;
  int64  seq_cursor = 7;
  string lease_owner = 8;
  int64  lease_expires_at_ms = 9;
  int64  started_at_ms = 10;
  int64  ended_at_ms = 11;
  string waiting_on_gate = 12;     // set iff status == WAITING

  // Identity & authorization context, mirrored from BeginRunRequest. Indexable
  // columns (tenant_id, actor, agent_id) drive the AIPlex run timeline queries;
  // labels stays free-form (JSON in storage).
  string tenant_id           = 20;
  string actor               = 21;
  string subject             = 22;
  string agent_id            = 23;
  string aiplex_instance_id  = 24;
  string gateway_route       = 25;
  repeated string scopes     = 26;
  map<string, string> labels = 27;
}

message JournalEntry {
  int64  seq             = 1;
  string kind            = 2;       // "decision" | "effect" | "obligation" | "gate" | "value" | "run" | "event"
  string payload_json    = 3;
  int64  ts_ms           = 4;
  // The event-bus rebuild (see design-principles/tape-event-bus.md):
  int64  global_seq      = 5;       // monotonic across all runs in this store
  string subject         = 6;       // /tape/<kind>/<verb>/<dim1>/<dim2>...
  int32  schema_version  = 7;       // payload schema version (default 1)
  string trace_id        = 8;       // W3C trace-context hex, propagated end-to-end
  string span_id         = 9;
  string parent_span_id  = 10;
}

// ── decision ledger ─────────────────────────────────────────────────────────

message RecordDecisionRequest {
  string run_id = 1;
  int64  decision_index = 2;       // ordinal of the model call within the run, 0-based
  string model = 3;
  string request_json = 4;
  string response_json = 5;
  string rationale = 6;
  string policy_version = 7;
}
message DecisionRecord {
  string run_id = 1;
  int64  seq = 2;                  // global journal seq
  int64  decision_index = 3;
  string model = 4;
  string request_json = 5;
  string response_json = 6;
  string rationale = 7;
  string policy_version = 8;
  int64  ts_ms = 9;
}

message GetDecisionRequest {
  string run_id = 1;
  int64  decision_index = 2;
}
message GetDecisionResponse {
  bool found = 1;                  // false => no record at this index; the re-drive must call the model for real
  DecisionRecord decision = 2;
}

// ── effect ledger ───────────────────────────────────────────────────────────

enum EffectStatus {
  EFFECT_STATUS_UNSPECIFIED = 0;
  EFFECT_STATUS_PENDING = 1;     // intent written, the act may or may not have happened
  EFFECT_STATUS_CONFIRMED = 2;   // the act happened, result recorded
  EFFECT_STATUS_FAILED = 3;      // the act definitively did not happen
  EFFECT_STATUS_UNKNOWN = 4;     // the act may have happened; the ack was lost — the reconciler will resolve it
}

// What an effect looks like from the counterparty's side. Tape does not pretend
// that exactly-once is achievable without upstream support; for non-idempotent
// upstreams the contract is: every effect has a durable intent, a controlled
// dispatch, an explicit ambiguity status (UNKNOWN), an observation protocol,
// and a compensation handle. EffectSemantics declares which contract applies.
enum EffectSemantics {
  EFFECT_SEMANTICS_UNSPECIFIED = 0;
  EFFECT_SEMANTICS_IDEMPOTENT = 1;       // the counterparty dedupes on our key → blind retry is safe
  EFFECT_SEMANTICS_NON_IDEMPOTENT = 2;   // a second call would land twice → outbox + reconciliation only
  EFFECT_SEMANTICS_OBSERVE_ONLY = 3;     // read-only effect (no side effects on the counterparty)
}

// How an effect's external IO is performed. INLINE = the tool body calls the
// counterparty itself (the default; idempotent upstreams). OUTBOX = the tool
// body only records intent; an outbox reactor picks it up and a registered
// connector performs the call once, with explicit ambiguity handling.
enum EffectDispatchMode {
  EFFECT_DISPATCH_MODE_UNSPECIFIED = 0;
  EFFECT_DISPATCH_MODE_INLINE = 1;
  EFFECT_DISPATCH_MODE_OUTBOX = 2;
}

// What the reconciler / connector observed at the counterparty for a given
// idempotency key (or business key). Drives the server-side transition into
// EffectStatus and obligation creation (DUPLICATE → register compensation).
enum EffectResolution {
  EFFECT_RESOLUTION_UNSPECIFIED = 0;
  EFFECT_RESOLUTION_CONFIRMED = 1;   // exactly one matching operation found
  EFFECT_RESOLUTION_FAILED = 2;      // the counterparty says it definitively did not happen
  EFFECT_RESOLUTION_ABSENT = 3;      // not found — for idempotent, safe to re-issue; for non-idempotent, needs approval
  EFFECT_RESOLUTION_DUPLICATE = 4;   // more than one matching operation — compensation required
  EFFECT_RESOLUTION_STUCK = 5;       // unresolvable — operator triage
}

message BeginEffectRequest {
  string run_id = 1;
  int64  decision_index = 2;       // which decision authorized this effect (-1 if none)
  string tool_name = 3;
  int32  call_index = 4;           // distinguish multiple calls of the same tool under one decision
  string request_json = 5;
  string custom_key = 6;           // if set, used verbatim instead of the decision-derived key
  // ── outbox / non-idempotent contract ───────────────────────────────────
  EffectSemantics      semantics     = 7;   // default: IDEMPOTENT
  EffectDispatchMode   dispatch_mode = 8;   // default: INLINE
  // The business-level key the counterparty would use to dedupe / observe a
  // *logical* operation (e.g. "acct123:1000:2026-05-17"). Distinct from the
  // run-derived idempotency_key; uniqueness across (connector, business_key)
  // is enforced when non-empty (no two effects can share a business key).
  string business_key = 9;
  // Free-form connector name (e.g. "bank.wire") for the outbox dispatcher to
  // route on. Required when dispatch_mode == OUTBOX.
  string connector    = 10;
  // ── authorization contract ────────────────────────────────────────────
  // The authorization scope this effect requires (e.g. "mcp:tools:bank_wire").
  // The server checks scope membership in the run's `scopes` before persisting
  // the effect; on mismatch the call is denied with PermissionDenied and a
  // `policy.violation` journal entry. Required for `semantics == NON_IDEMPOTENT`
  // (the SDK enforces at decoration time too). Empty for unscoped effects.
  string scope        = 11;
}
message BeginEffectResponse {
  int64  seq = 1;
  string idempotency_key = 2;      // = "<run_id>/decision-<i>/<tool>/<call_index>" unless custom_key was given
  EffectStatus status = 3;         // PENDING (fresh) | CONFIRMED/FAILED/UNKNOWN (already on file -> short-circuit)
  string response_json = 4;        // populated iff status == CONFIRMED
  string error_json = 5;           // populated iff status == FAILED/UNKNOWN
}

message CompleteEffectRequest {
  string run_id = 1;
  string idempotency_key = 2;
  EffectStatus status = 3;         // CONFIRMED | FAILED | UNKNOWN
  string response_json = 4;
  string error_json = 5;
}
message GetEffectRequest {
  string run_id = 1;
  string idempotency_key = 2;
}
message GetEffectResponse {
  bool found = 1;
  EffectRecord effect = 2;
}
message ReconcileEffectRequest {
  string run_id = 1;
  string idempotency_key = 2;
  EffectStatus resolved_status = 3;   // CONFIRMED | FAILED
  string response_json = 4;
  string error_json = 5;
}
message EffectRecord {
  string run_id = 1;
  int64  seq = 2;
  int64  decision_index = 3;
  string tool_name = 4;
  string idempotency_key = 5;
  EffectStatus status = 6;
  string request_json = 7;
  string response_json = 8;
  string error_json = 9;
  int64  ts_ms = 10;
  // ── outbox / non-idempotent contract ───────────────────────────────────
  EffectSemantics      semantics          = 11;
  EffectDispatchMode   dispatch_mode      = 12;
  string business_key                     = 13;
  string connector                        = 14;
  int32  dispatch_attempts                = 15;  // bumped by RecordDispatchAttempt
  int64  next_dispatch_at_ms              = 16;  // backoff: outbox is eligible only when this <= now
  // The counterparty's identifier for the operation, captured on first observe
  // (e.g. a wire_id, a payment_intent_id). Empty until known.
  string external_ref                     = 17;
  // Outbox dispatch lease — set by ClaimEffectDispatch, cleared on success/failure.
  string dispatch_claimed_by              = 18;
  int64  dispatch_claim_expires_at_ms     = 19;
  string last_dispatch_error              = 20;
  // The authorization scope under which this effect was admitted (verified
  // against the run's `scopes` at BeginEffect time). Empty for unscoped
  // effects.
  string scope                            = 21;
}

// ── outbox dispatch requests/responses ─────────────────────────────────────

message ListEffectsToDispatchRequest {
  int64 now_ms = 1;             // 0 => server time
  int64 limit = 2;              // 0 => 200
  string connector = 3;         // "" => any connector
}
message ListEffectsToDispatchResponse {
  repeated EffectRecord effects = 1;
}

message ClaimEffectDispatchRequest {
  // Atomic CAS: status==PENDING && dispatch_mode==OUTBOX && next_dispatch_at_ms<=now
  // && (dispatch_claimed_by=='' OR dispatch_claim_expires_at_ms<=now)
  //   →  set dispatch_claimed_by=claimer, dispatch_claim_expires_at_ms=now+ttl.
  string run_id = 1;
  string idempotency_key = 2;
  string claimer = 3;
  int64  lease_ttl_ms = 4;       // 0 => server default (60_000)
}
message ClaimEffectDispatchResponse {
  bool acquired = 1;
  EffectRecord effect = 2;
}

message RecordDispatchAttemptRequest {
  // Reports a *failed* dispatch. The server bumps dispatch_attempts, sets
  // last_dispatch_error, clears the lease, and either reschedules (status
  // stays PENDING, next_dispatch_at_ms updated) or transitions to UNKNOWN
  // (when next_dispatch_at_ms == 0, meaning "the ack was lost — the
  // reconciler must resolve this; do not blindly re-dispatch").
  string run_id = 1;
  string idempotency_key = 2;
  string error = 3;
  // 0 => move to UNKNOWN (terminal for the outbox loop; the reconciler takes over).
  int64  next_dispatch_at_ms = 4;
}

message RecordExternalObservationRequest {
  // Called by the reconciler (or a connector's observe() path) to record what
  // the counterparty said about a (run_id, idempotency_key). The server maps
  // EffectResolution → EffectStatus and, on DUPLICATE, registers a
  // compensation obligation if `compensate_on_duplicate_kind` is set.
  string run_id = 1;
  string idempotency_key = 2;
  EffectResolution resolution = 3;
  string external_ref = 4;
  string response_json = 5;
  string error_json = 6;
  // If resolution == DUPLICATE and this is non-empty, register a compensation
  // obligation with this kind so the obligations reactor can unwind the dup.
  string compensate_on_duplicate_kind = 7;
}

// ── obligations / compensation ──────────────────────────────────────────────
//
// State machine, mirroring the effect ledger's PENDING/CONFIRMED/FAILED/UNKNOWN
// thickness on the compensation side:
//
//   register_compensation
//           │
//           ▼
//   ┌──────────────┐    claim_obligation (CAS, with lease)
//   │   PENDING    │ ──────────────────────────────────► ┌────────────┐
//   │ (queued; or  │ ◄── record_obligation_attempt ───── │ COMMITTED  │
//   │  backoff if  │     (failure with retries left)     │ (in flight)│
//   │  next_attempt│                                     └─────┬──────┘
//   │  _at_ms > now│                  resolve_obligation       │
//   └──────────────┘                  ┌───────────────┬────────┘
//                                     ▼               ▼
//                              COMPENSATED          STUCK
//                              (success,            (failure;
//                               terminal)           retries exhausted)
//
// PENDING is the only state the drainer touches. The reactor calls
// ClaimObligation (CAS — eligible iff status==PENDING AND next_attempt_at_ms<=now
// AND no live lease) to move PENDING → COMMITTED with `claimed_by` +
// `claim_expires_at_ms`. From COMMITTED the drainer either calls
// ResolveObligation(COMPENSATED|STUCK) terminally, or RecordObligationAttempt
// to set last_error+attempts+next_attempt_at_ms and slide back to PENDING for
// the next retry (or terminally to STUCK if attempts exceed max_attempts).
// Expired COMMITTED leases are reclaimed by the next ClaimObligation that
// sees claim_expires_at_ms < now — same atomic CAS, no manual recovery.

enum ObligationStatus {
  OBLIGATION_STATUS_UNSPECIFIED = 0;
  OBLIGATION_STATUS_PENDING = 1;        // queued; eligible when next_attempt_at_ms <= now and no live lease
  OBLIGATION_STATUS_COMMITTED = 2;      // a drainer holds the lease; in flight
  OBLIGATION_STATUS_COMPENSATED = 3;    // the inverse ran successfully (terminal)
  OBLIGATION_STATUS_STUCK = 4;          // retries exhausted; needs a human (terminal)
}

message RegisterCompensationRequest {
  string run_id = 1;
  string effect_key = 2;         // the idempotency_key of the effect this unwinds
  string kind = 3;               // e.g. "reverse_wire" — used for the in-process registry lookup
  string payload_json = 4;
  // The fully-qualified callable for a cross-process drainer to import, e.g.
  // "treasury.agent:reverse_wire". Optional — when set, a generic drainer
  // process (one that doesn't import the agent module at boot) can resolve
  // the inverse on demand. The in-process registry (`kind`) still takes
  // precedence when both are available.
  string compensator_ref = 5;
  int32  max_attempts = 6;       // 0 => server default (5)
}
message ListObligationsRequest {
  string run_id = 1;
  bool   only_unresolved = 2;          // shorthand: exclude COMPENSATED and STUCK
  ObligationStatus status_filter = 3;  // 0 (UNSPECIFIED) = any; otherwise an exact match
}
message ListObligationsResponse {
  repeated ObligationRecord obligations = 1;   // newest-first (LIFO) — the LIFO drain order
}
message ResolveObligationRequest {
  string run_id = 1;
  int64  obligation_seq = 2;
  ObligationStatus status = 3;   // COMPENSATED | STUCK — terminal transitions only
  string result_json = 4;
}
message ObligationRecord {
  string run_id = 1;
  int64  seq = 2;
  string effect_key = 3;
  string kind = 4;
  string payload_json = 5;
  ObligationStatus status = 6;
  int64  ts_ms = 7;
  // The drainer surface.
  string compensator_ref = 8;        // optional "module:attr" for generic drainers
  int32  attempts = 9;                // count of failed attempts; bumped by RecordObligationAttempt
  int32  max_attempts = 10;           // 0 => server default (5)
  int64  next_attempt_at_ms = 11;     // backoff: PENDING is eligible only when this <= now
  string last_error = 12;             // populated by RecordObligationAttempt
  string claimed_by = 13;             // the drainer holding the lease (empty when not COMMITTED)
  int64  claim_expires_at_ms = 14;    // lease deadline; expired COMMITTED is re-claimable
  string result_json = 15;            // populated by ResolveObligation
}

message ListUnresolvedObligationsRequest {
  // Cross-run query for the obligations reactor (and operator dashboards).
  // Defaults: include_pending=true, include_stuck=false, include_committed_expired=true.
  int32 limit = 1;                    // 0 => server default (500)
  int64 now_ms = 2;                   // 0 => server's current clock
  bool  include_pending = 3;          // PENDING with next_attempt_at_ms <= now
  bool  include_stuck = 4;            // terminal STUCK rows (operator triage)
  bool  include_committed_expired = 5;// COMMITTED with claim_expires_at_ms <= now (reclaim)
}
message ListUnresolvedObligationsResponse {
  repeated ObligationRecord obligations = 1;
}

message ClaimObligationRequest {
  // Atomic CAS:  PENDING (and next_attempt_at_ms <= now)  ──► COMMITTED with lease.
  // Also reclaims COMMITTED rows whose claim_expires_at_ms <= now (stale leases).
  // Returns acquired=false (with the current row) if another claimer won.
  string run_id = 1;
  int64  obligation_seq = 2;
  string claimer = 3;                 // hostname / pod id — recorded as claimed_by
  int64  lease_ttl_ms = 4;            // 0 => server default (60_000)
}
message ClaimObligationResponse {
  bool acquired = 1;
  ObligationRecord obligation = 2;
}

message RecordObligationAttemptRequest {
  // Reports a *failed* attempt. The server bumps `attempts`, sets `last_error`,
  // and either schedules a retry (status -> PENDING with next_attempt_at_ms) or
  // marks the obligation terminally STUCK (when attempts >= max_attempts, or
  // when next_attempt_at_ms == 0 meaning "this is a final failure").
  string run_id = 1;
  int64  obligation_seq = 2;
  string error = 3;
  int64  next_attempt_at_ms = 4;      // 0 => terminal (force STUCK regardless of attempts)
}

// ── budget ──────────────────────────────────────────────────────────────────

message SetBudgetRequest {
  string run_id = 1;
  double usd_cap = 2;            // <= 0 means "no cap"
  int64  token_cap = 3;          // <= 0 means "no cap"
}
message AdmitBudgetRequest {
  string run_id = 1;
  double usd_estimate = 2;
  int64  token_estimate = 3;
}
message AdmitBudgetResponse {
  bool admitted = 1;
  string reason = 2;             // populated iff !admitted
  BudgetState budget = 3;
}
message ChargeBudgetRequest {
  string run_id = 1;
  double usd = 2;
  int64  tokens = 3;
}
message BudgetState {
  string run_id = 1;
  double usd_cap = 2;
  int64  token_cap = 3;
  double usd_spent = 4;
  int64  tokens_spent = 5;
}

// ── gates / signals ─────────────────────────────────────────────────────────

message AwaitSignalRequest {
  string run_id = 1;
  string gate_name = 2;
  string payload_json = 3;       // the gate's own context (e.g. what is being approved)
}
message AwaitSignalResponse {
  bool   delivered = 1;          // true => the signal was already sent; resolution_json is the answer
  string resolution_json = 2;
}
message SendSignalRequest {
  string run_id = 1;             // optional; if empty, app_name+user_id+session_id route it
  string app_name = 2;
  string user_id = 3;
  string session_id = 4;
  string gate_name = 5;
  string resolution_json = 6;
}
message SendSignalResponse {
  bool   accepted = 1;
  string run_id = 2;
  RunStatus run_status = 3;       // RUNNABLE if the run was waiting and is now released
}

// ── reconciliation ──────────────────────────────────────────────────────────

message ListPendingEffectsRequest {
  int64 older_than_ms = 1;        // only effects whose ts_ms < older_than_ms; 0 => all (used for PENDING)
  int64 limit = 2;
  bool   include_pending = 3;     // default behaviour if neither is set: both
  bool   include_unknown = 4;
}
message ListPendingEffectsResponse {
  repeated EffectRecord effects = 1;
}

// ── timers ──────────────────────────────────────────────────────────────────

message SetTimerRequest {
  string run_id = 1;
  string timer_id = 2;            // "" => server generates; (run_id, timer_id) is the key — idempotent
  int64  fire_at_ms = 3;
  string kind = 4;                // e.g. "redrive" | "gate_timeout" | "reconcile" | <yours>
  string payload_json = 5;
}
message TimerRecord {
  string run_id = 1;
  string timer_id = 2;
  int64  fire_at_ms = 3;
  string kind = 4;
  string payload_json = 5;
  bool   fired = 6;
  int64  created_at_ms = 7;
}
message CancelTimerRequest { string run_id = 1; string timer_id = 2; }
message CancelTimerResponse { bool cancelled = 1; }
message ListDueTimersRequest {
  int64 now_ms = 1;               // 0 => server time
  int64 limit = 2;
  bool   claim = 3;               // true => atomically mark the returned timers fired (so a peer reactor won't re-fire them)
}
message ListDueTimersResponse { repeated TimerRecord timers = 1; }

// ── the WAL → reactors feed ─────────────────────────────────────────────────

message SubscribeEventsRequest {
  // Legacy filters (still honoured for back-compat).
  int64  from_ts_ms      = 1;     // tail from this timestamp (0 => from the beginning)
  string run_id          = 2;     // "" => all runs
  string kind            = 3;     // "" => all kinds  (decision | effect | obligation | gate | value | run | event)
  // New (preferred) filters — see design-principles/tape-event-bus.md.
  int64  from_global_seq = 4;     // tail from this global_seq (0 => from earliest)
  string subject_pattern = 5;     // /tape/<kind>/<verb>/.../**  ; "" => match all
}
message SubscribeBySubjectRequest {
  string subject_pattern = 1;     // /tape/<kind>/<verb>/.../**
  string predicate_cel   = 2;     // CEL expression; "" => always-true
  int64  from_global_seq = 3;     // 0 => from earliest available
}
message EventEntry {
  string run_id          = 1;
  int64  seq             = 2;
  string kind            = 3;
  string payload_json    = 4;
  int64  ts_ms           = 5;
  // Event-bus rebuild fields:
  int64  global_seq      = 6;
  string subject         = 7;
  int32  schema_version  = 8;
  string trace_id        = 9;
  string span_id         = 10;
  string parent_span_id  = 11;
}

// ── reactions & tasks ───────────────────────────────────────────────────────

enum HandlerKind {
  HANDLER_KIND_UNSPECIFIED = 0;
  HANDLER_KIND_AGENT       = 1;   // matching entries create tape_runs (durable, multi-step)
  HANDLER_KIND_TASK        = 2;   // matching entries create tape_tasks for the in-proc dispatcher
  HANDLER_KIND_PUBLISH     = 3;   // matching entries create tape_tasks for a broker bridge
}

message Reaction {
  string      reaction_id      = 1;   // stable id; "" => server generates
  string      name             = 2;   // human label
  string      subject_pattern  = 3;   // /tape/.../*/.../**
  string      predicate_cel    = 4;   // CEL; "" => always-true
  HandlerKind handler_kind     = 5;
  string      agent_app        = 6;   // kind=AGENT: which app to re-invoke
  string      publish_target   = 7;   // kind=PUBLISH: e.g. pubsub://proj/topic, nats://subj
  int32       max_concurrency  = 8;   // <= 0 => 1
  int32       rate_limit_per_s = 9;   // 0 => unbounded
  int32       debounce_ms      = 10;  // coalesce repeated (reaction, subject) within window
  int32       retry_max        = 11;  // attempts before NackTask(permanent=true)
  int32       retry_backoff_ms = 12;  // starting backoff; doubles each attempt
  int32       dlq_after_n      = 13;  // status=DLQ after this many attempts
  int32       num_shards       = 14;  // <= 0 => 1; tasks hashed by source_run_id % num_shards
  int64       created_at_ms    = 15;
  bool        deleted          = 16;
  // When true, RegisterReaction seeds the per-shard cursors at the current
  // journal head — so the reaction only sees entries written AFTER its
  // registration, never the backlog. When false (default), the cursors start
  // at 0 and replay every existing journal entry through the reaction. Set
  // this for reactions that don't want history (alerts on new effects, hot-
  // path debounce of live FX writes); leave it false for replay-style work
  // (audit projections, cold-start rebuilds).
  bool        bootstrap_from_head = 17;
}

message DeregisterReactionRequest  { string reaction_id = 1; }
message DeregisterReactionResponse { bool   deregistered = 1; }
message ListReactionsRequest       { string subject_pattern = 1; }   // "" => all
message ListReactionsResponse      { repeated Reaction reactions = 1; }

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING     = 1;
  TASK_STATUS_CLAIMED     = 2;
  TASK_STATUS_DONE        = 3;
  TASK_STATUS_FAILED      = 4;   // soft fail; will be retried until DLQ
  TASK_STATUS_DLQ         = 5;
}

message Task {
  string     task_id             = 1;
  string     reaction_id         = 2;
  int32      shard               = 3;
  string     source_run_id       = 4;
  int64      source_global_seq   = 5;
  string     subject             = 6;
  string     payload_json        = 7;
  TaskStatus status              = 8;
  int32      attempts            = 9;
  int64      next_attempt_at_ms  = 10;
  string     lease_owner         = 11;
  int64      lease_expires_at_ms = 12;
  string     last_error          = 13;
  int64      created_at_ms       = 14;
  string     trace_id            = 15;
  string     parent_span_id      = 16;
}

message ClaimTasksRequest {
  string reaction_id = 1;
  int32  shard       = 2;        // <0 => any shard
  string owner       = 3;
  int64  lease_ms    = 4;        // <=0 => server default (60_000)
  int32  max         = 5;        // <=0 => server default (16)
  int64  now_ms      = 6;        // 0 => server time
}
message ClaimTasksResponse  { repeated Task tasks = 1; }
message CompleteTaskRequest { string task_id = 1; string owner = 2; }
message CompleteTaskResponse { Task task = 1; }
message NackTaskRequest    {
  string task_id   = 1;
  string owner     = 2;
  string error     = 3;
  bool   permanent = 4;          // true => DLQ immediately regardless of attempts
}
message NackTaskResponse   { Task task = 1; }
message ListTasksRequest   { string reaction_id = 1; TaskStatus status = 2; int32 limit = 3; }
message ListTasksResponse  { repeated Task tasks = 1; }

// ── reactive key-value store ───────────────────────────────────────────────

message ValueRecord {
  string namespace = 1;         // user-chosen namespace (e.g. "treasury", "user:<id>", "run:<run_id>", "")
  string key = 2;
  string value_json = 3;
  int64  version = 4;            // monotonic per (namespace, key); CAS uses this
  int64  ts_ms = 5;
  string writer = 6;             // free-form attribution (a process id, an agent name, …)
  bool   deleted = 7;            // set on the event emitted by DeleteValue
}

message WriteValueRequest {
  string namespace = 1;
  string key = 2;
  string value_json = 3;
  int64  if_version = 4;         // optimistic CAS: only write if the current version == if_version. < 0 disables.
  string writer = 5;
}

message GetValueRequest { string namespace = 1; string key = 2; }
message GetValueResponse { bool found = 1; ValueRecord value = 2; }

message WatchValueRequest {
  string namespace = 1;
  string key = 2;
  int64  from_version = 3;       // 0 => start from the current value (one snapshot, then changes)
}
message ValueEvent {
  ValueRecord value = 1;         // the new value (or `deleted = true`)
  int64  prev_version = 2;       // 0 if no prior value
  string prev_value_json = 3;    // "" if no prior value
}

message DeleteValueRequest { string namespace = 1; string key = 2; }
message DeleteValueResponse { bool deleted = 1; int64 version = 2; }

// ── ADK SessionService shim ─────────────────────────────────────────────────


message Session {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;
  string state_json = 4;          // the merged session state (run-scoped keys)
  repeated EventRecord events = 5;
  int64  last_update_time_ms = 6;
}
message EventRecord {
  string id = 1;
  string invocation_id = 2;
  string author = 3;
  string branch = 4;
  string content_json = 5;
  string actions_json = 6;
  int64  timestamp_ms = 7;
}

message CreateSessionRequest {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;          // optional; server generates if empty
  string state_json = 4;
}
message GetSessionRequest {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;
  int64  max_events = 4;          // 0 => all
}
message GetSessionResponse {
  bool found = 1;
  Session session = 2;
}
message ListSessionsRequest {
  string app_name = 1;
  string user_id = 2;
}
message ListSessionsResponse {
  repeated Session sessions = 1;  // metadata only; events omitted
}
message DeleteSessionRequest {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;
}
message DeleteSessionResponse { bool deleted = 1; }

message AppendEventRequest {
  string app_name = 1;
  string user_id = 2;
  string session_id = 3;
  EventRecord event = 4;
  string state_delta_json = 5;    // applied to session state in the same txn
}
message AppendEventResponse {
  EventRecord event = 1;
  int64  last_update_time_ms = 2;
}
