{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tape.fullname" . }}-server
spec:
  podSelector:
    matchLabels: {{- include "tape.serverSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tape.name" . }}
      ports:
        - protocol: TCP
          port: 7878
{{- end }}
