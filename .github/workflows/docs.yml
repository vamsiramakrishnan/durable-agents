name: docs

on:
  push:
    branches: [main]
    paths:
      - "tape/docs/**"
      - "tape/sdk/**"
      - "tape/cli/**"
      - "design-principles/**"
      - "scripts/docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "tape/README.md"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same group
# so a fast-typed push supersedes its predecessor without clobbering the live
# site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "docs/requirements.txt" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: "tape/sdk/typescript/package-lock.json" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21", cache: "maven" }

      # ── Install docs build deps + the SDKs the generators introspect ─────
      - name: Install docs deps
        run: |
          python -m pip install -U pip
          pip install -r docs/requirements.txt
          pip install -e tape/sdk/python
          pip install -e tape/cli

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Install TypeScript deps
        working-directory: tape/sdk/typescript
        run: npm ci

      # ── Generate per-language SDK reference ─────────────────────────────
      # Each generator is allowed to fail without taking the whole build down:
      # the site is more valuable shipped-with-stale-Go-docs than not shipped.
      # A failure is surfaced as a warning step so the regression is visible
      # in the run summary without being fatal.
      - name: Generate design pages
        run: bash scripts/docs/gen_design.sh

      - name: Generate Go reference (gomarkdoc)
        run: bash scripts/docs/gen_go.sh
        continue-on-error: true

      - name: Generate TypeScript reference (typedoc)
        run: bash scripts/docs/gen_typescript.sh
        continue-on-error: true

      - name: Generate Java reference (mvn javadoc)
        run: bash scripts/docs/gen_java.sh
        continue-on-error: true

      - name: Generate CLI reference (typer introspection)
        run: python scripts/docs/gen_cli.py
        continue-on-error: true

      # ── Build the site ─────────────────────────────────────────────────
      - name: mkdocs build
        run: mkdocs build --site-dir ./site

      # ── Upload as a Pages artifact ─────────────────────────────────────
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
