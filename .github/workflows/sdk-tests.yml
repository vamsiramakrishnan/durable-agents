name: sdk-tests

# Per-SDK smoke tests + the Rust server's unit tests. Runs on every PR.
#
# These mirror the local `make sdk-test-all` flow, parallelized across jobs.
# Each language's job spawns the Rust tape-server in-memory and round-trips
# the lifecycle.

on:
  pull_request:
    paths:
      - "tape/**"
      - "Makefile"
      - "setup.sh"
      - ".github/workflows/sdk-tests.yml"
  push:
    branches: [main]
    paths:
      - "tape/**"
      - "Makefile"
      - "setup.sh"
      - ".github/workflows/sdk-tests.yml"
  workflow_dispatch:

concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust server: unit tests + a debug binary every language test uses ──
  server:
    name: tape-server (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "tape/server" }
      # tape/server/build.rs invokes prost-build, which shells out to
      # `protoc` to compile tape.proto. The ubuntu-latest runner image
      # doesn't include it by default — install it before any cargo step.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
      - name: cargo test
        working-directory: tape/server
        run: cargo test --locked
      - name: cargo build (debug)
        working-directory: tape/server
        run: cargo build --locked
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/tape-server

  # ── Python SDK + integration tests ──
  python:
    name: tape-py
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - uses: actions/download-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/
      - run: chmod +x tape/server/target/debug/tape-server
      - name: Install SDK + CLI
        run: |
          pip install -U pip
          pip install -e 'tape/sdk/python[dev]'
          pip install -e tape/cli
      - name: pytest (kill-and-resume + features)
        run: python -m pytest tape/tests -q

  # ── TypeScript SDK ──
  typescript:
    name: tape-ts
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: "tape/sdk/typescript/package-lock.json" }
      - uses: actions/download-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/
      - run: chmod +x tape/server/target/debug/tape-server
      - name: npm test
        working-directory: tape/sdk/typescript
        run: |
          npm install
          npm test

  # ── Go SDK ──
  go:
    name: tape-go
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: "tape/sdk/go/go.sum" }
      - uses: actions/download-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/
      - run: chmod +x tape/server/target/debug/tape-server
      - name: go test
        working-directory: tape/sdk/go
        run: go test -timeout 90s ./...

  # ── Java SDK ──
  java:
    name: tape-java
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21", cache: "maven" }
      - uses: actions/download-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/
      - run: chmod +x tape/server/target/debug/tape-server
      - name: mvn test
        working-directory: tape/sdk/java
        run: mvn -B -q test

  # ── Cross-SDK outbox parity (G3) ──
  # One scenario, four languages, identical journal projection. Each language's
  # outbox CLI runs the same dispatch loop against the same Tape server.
  parity:
    name: sdk-parity (python · ts · go · java)
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: "tape/sdk/go/go.sum" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21", cache: "maven" }
      - uses: actions/download-artifact@v4
        with:
          name: tape-server-debug
          path: tape/server/target/debug/
      - run: chmod +x tape/server/target/debug/tape-server
      - name: Install Python SDK + pytest
        run: |
          pip install -U pip
          pip install -e 'tape/sdk/python[dev]'
      - name: Pre-install TS deps (cold install is slow inside the test)
        working-directory: tape/sdk/typescript
        run: npm install
      - name: Pre-build Java jar + classpath (cold mvn is slow inside the test)
        working-directory: tape/sdk/java
        run: |
          mvn -B -q -DskipTests package
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt -Dmdep.includeScope=runtime
      - name: Cross-SDK outbox parity
        run: python -m pytest tape/tests/parity -v
