<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title>Every Behavioural Change Is a Migration</title>
  <desc>Deploying v2 while v1 instances are mid-flight: a drain window where two versions of the logic coexist, gated by patched(); the marker is removed only once all v1 instances drain.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <style>
      .bg{fill:#fbfaf7}
      .title{font:700 33px ui-serif,Georgia,serif;fill:#1f1f1f}
      .subtitle{font:400 17px ui-serif,Georgia,serif;fill:#686868}
      .label{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .small{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#404040}
      .tiny{font:400 12px ui-sans-serif,system-ui,sans-serif;fill:#686868}
      .code{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f1f1f}
      .t{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f1f1f}
      .axis{stroke:#1f1f1f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .tick{stroke:#1f1f1f;stroke-width:2}
      .v1{fill:#F4E7D8;stroke:#A36A28;stroke-width:1.6;rx:10}
      .v2{fill:#E8EEF5;stroke:#486A8F;stroke-width:1.6;rx:10}
      .drain{fill:#F2DEDE;fill-opacity:0.45;stroke:#8A3C3C;stroke-width:1.5;stroke-dasharray:7 4;rx:8}
      .box{fill:#fffefa;stroke:#1f1f1f;stroke-width:1.5;rx:10}
      .green{fill:#E5EFE8;stroke:#4E745B;stroke-width:1.6;rx:10}
      .line{stroke:#1f1f1f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dot{stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:3 3;fill:none}
      .soft{fill:#EAE7DF;stroke:#1f1f1f;stroke-width:1.2;rx:10}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="600"/>
  <text x="60" y="54" class="title">Every Behavioural Change Is a Migration</text>
  <text x="60" y="82" class="subtitle">Deploy v2 while v1 instances are mid-flight — and a multi-day suspend guarantees some are.</text>

  <!-- time axis -->
  <path d="M90,440 L1130,440" class="axis"/>
  <line x1="280" y1="432" x2="280" y2="448" class="tick"/><text x="280" y="468" class="t" text-anchor="middle">deploy v2</text>
  <line x1="900" y1="432" x2="900" y2="448" class="tick"/><text x="900" y="468" class="t" text-anchor="middle">last v1 instance drains</text>

  <!-- deploy box -->
  <line x1="280" y1="440" x2="280" y2="220" class="dot"/>
  <rect x="120" y="120" width="380" height="100" class="box"/><text x="310" y="142" class="label" text-anchor="middle">v2 adds a behavioural change, gated:</text>
  <text x="140" y="166" class="code">if workflow.patched("v2-revalue-before-hedge"):</text>
  <text x="160" y="186" class="code">balances = await execute_activity(revalue, ...)</text>
  <text x="140" y="208" class="tiny">true in new code · false in replayed old code</text>

  <!-- drain window band -->
  <rect x="280" y="248" width="620" height="170" class="drain"/>
  <text x="590" y="270" class="label" text-anchor="middle" fill="#8A3C3C">THE DRAIN WINDOW — two versions of the logic coexist</text>
  <text x="590" y="290" class="tiny" text-anchor="middle">you cannot skip it; the test replays old histories against new code</text>

  <!-- v1 lane -->
  <rect x="300" y="304" width="560" height="44" class="v1"/><text x="320" y="324" class="label">v1 instances (started before the deploy)</text><text x="320" y="340" class="small">hit the gate → patched(...) = FALSE in replay → SKIP the new branch → consistent with their history</text>
  <!-- v2 lane -->
  <rect x="300" y="356" width="560" height="44" class="v2"/><text x="320" y="376" class="label">v2 runs (started after the deploy)</text><text x="320" y="392" class="small">hit the gate → patched(...) = TRUE → TAKE the new branch → ...both reach the next step with consistent history</text>

  <!-- after drain -->
  <line x1="900" y1="440" x2="900" y2="240" class="dot"/>
  <rect x="900" y="120" width="280" height="100" class="green"/><text x="1040" y="142" class="label" text-anchor="middle">all v1 drained →</text><text x="1040" y="164" class="small" text-anchor="middle">remove the marker</text><text x="1040" y="184" class="small" text-anchor="middle">— which is itself a</text><text x="1040" y="204" class="small" text-anchor="middle">versioned change (now v3)</text>

  <rect x="200" y="496" width="800" height="58" class="soft"/><text x="600" y="518" class="label" text-anchor="middle">Schema evolution for control flow. patched() / GetVersion / worker versioning is the discipline —</text><text x="600" y="538" class="small" text-anchor="middle">a discipline, not a switch. The single most underweighted operational cost of the whole category.</text>
</svg>
