<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title>Tape in the Stack</title>
  <desc>Tape in the Stack — a durable-execution server sitting beneath an ADK agent, between the agent SDK and Postgres.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px ui-serif, Georgia, serif; fill: #1f1f1f; }
      .subtitle { font: 400 18px ui-serif, Georgia, serif; fill: #686868; }
      .label { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .small { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .mono { font: 500 13px ui-monospace, Menlo, Consolas, monospace; fill: #1f1f1f; }
      .box { fill: #fffefa; stroke: #1f1f1f; stroke-width: 1.6; }
      .soft { fill: #EAE7DF; stroke: #1f1f1f; stroke-width: 1.3; }
      .amber { fill: #F4E7D8; stroke: #A36A28; stroke-width: 1.7; }
      .blue { fill: #E8EEF5; stroke: #486A8F; stroke-width: 1.7; }
      .green { fill: #E5EFE8; stroke: #4E745B; stroke-width: 1.7; }
      .line { stroke: #1f1f1f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text x="60" y="64" class="title">Tape in the Stack</text>
  <text x="60" y="94" class="subtitle">The agent stays in its own language. The runtime that survives the model is a separate system.</text>

  <rect x="130" y="130" width="940" height="56" rx="14" class="box"/>
  <text x="160" y="155" class="label">Product</text><text x="160" y="174" class="small">the CFO's app · the SRE's runbook · the support desk</text>

  <rect x="130" y="200" width="940" height="66" rx="14" class="amber"/>
  <text x="160" y="226" class="label">ADK agent</text><text x="160" y="246" class="small">LlmAgent · FunctionTool · Runner · LongRunningFunctionTool — Python / Java / Go / TypeScript</text>

  <rect x="130" y="280" width="940" height="66" rx="14" class="blue"/>
  <text x="160" y="306" class="label">Tape SDK (thin gRPC client)</text>
  <text x="160" y="326" class="mono">TapePlugin · TapeSessionService · @tape.effect · tape.gated · tape.Budget · TapeClient</text>

  <rect x="130" y="360" width="940" height="120" rx="14" class="green"/>
  <text x="160" y="386" class="label">Tape server  (Rust · Tokio · Tonic · sqlx)</text>
  <rect x="160" y="400" width="170" height="34" rx="8" class="box"/><text x="245" y="422" class="small" text-anchor="middle">Run registry</text>
  <rect x="345" y="400" width="170" height="34" rx="8" class="box"/><text x="430" y="422" class="small" text-anchor="middle">Decision ledger</text>
  <rect x="530" y="400" width="170" height="34" rx="8" class="box"/><text x="615" y="422" class="small" text-anchor="middle">Effect ledger</text>
  <rect x="715" y="400" width="170" height="34" rx="8" class="box"/><text x="800" y="422" class="small" text-anchor="middle">Obligation ledger</text>
  <rect x="900" y="400" width="150" height="34" rx="8" class="box"/><text x="975" y="422" class="small" text-anchor="middle">Gate / Signal</text>
  <rect x="160" y="442" width="170" height="30" rx="8" class="box"/><text x="245" y="462" class="small" text-anchor="middle">Budget acct.</text>
  <rect x="345" y="442" width="170" height="30" rx="8" class="box"/><text x="430" y="462" class="small" text-anchor="middle">Reconciler</text>
  <rect x="530" y="442" width="170" height="30" rx="8" class="box"/><text x="615" y="462" class="small" text-anchor="middle">Recovery loop</text>
  <rect x="715" y="442" width="335" height="30" rx="8" class="box"/><text x="882" y="462" class="small" text-anchor="middle">Storage trait — Postgres · SQLite</text>

  <rect x="130" y="494" width="940" height="56" rx="14" class="soft"/>
  <text x="160" y="519" class="label">Postgres</text><text x="160" y="538" class="small">the journal (decisions ∪ effects ∪ obligations) + the ADK session/event mirror</text>

  <rect x="130" y="564" width="940" height="56" rx="14" class="soft"/>
  <text x="160" y="589" class="label">Systems of record</text><text x="160" y="608" class="small">the bank · the broker · the GL · ticketing · email · browsers · cloud APIs</text>

  <path d="M600,186 L600,200" class="line"/>
  <path d="M600,266 L600,280" class="line"/>
  <path d="M600,346 L600,360" class="line"/>
  <path d="M600,480 L600,494" class="line"/>
  <path d="M600,550 L600,564" class="line"/>

  <rect x="230" y="645" width="740" height="44" rx="10" class="soft"/>
  <text x="600" y="673" class="label" text-anchor="middle">Two lines wire it in. The tool bodies stay plain.</text>
</svg>
