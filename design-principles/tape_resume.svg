<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title>Crash and Resume, Once</title>
  <desc>Crash and Resume, Once — the agent crashes mid-run; on re-invoke by invocation_id, ADK re-drives, Tape replays decisions and short-circuits confirmed effects, the reconciler resolves any pending effect, and the run completes exactly once.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#8A3C3C"/></marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 33px ui-serif, Georgia, serif; fill: #1f1f1f; }
      .subtitle { font: 400 18px ui-serif, Georgia, serif; fill: #686868; }
      .label { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .small { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #1f1f1f; }
      .tiny { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #686868; }
      .mono { font: 600 12px ui-monospace, Menlo, Consolas, monospace; fill: #1f1f1f; }
      .box { fill: #fffefa; stroke: #1f1f1f; stroke-width: 1.6; }
      .blue { fill: #E8EEF5; stroke: #486A8F; stroke-width: 1.7; }
      .green { fill: #E5EFE8; stroke: #4E745B; stroke-width: 1.7; }
      .red { fill: #F2DEDE; stroke: #8A3C3C; stroke-width: 1.7; }
      .amber { fill: #F4E7D8; stroke: #A36A28; stroke-width: 1.7; }
      .soft { fill: #EAE7DF; stroke: #1f1f1f; stroke-width: 1.2; }
      .line { stroke: #1f1f1f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-red { stroke: #8A3C3C; stroke-width: 2.4; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #686868; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="600"/>
  <text x="60" y="62" class="title">Crash and Resume, Once</text>
  <text x="60" y="92" class="subtitle">One wire. One GL record. One reconciliation — regardless of where the crash landed.</text>

  <!-- run 1 -->
  <text x="60" y="150" class="label">Run 1 — the agent process</text>
  <rect x="60" y="165" width="135" height="58" rx="10" class="blue"/><text x="127" y="190" class="small" text-anchor="middle">decide: plan</text><text x="127" y="208" class="tiny" text-anchor="middle">RecordDecision(1)</text>
  <rect x="215" y="165" width="135" height="58" rx="10" class="green"/><text x="282" y="190" class="small" text-anchor="middle">tool: read</text><text x="282" y="208" class="tiny" text-anchor="middle">effect 2 · confirmed</text>
  <rect x="370" y="165" width="135" height="58" rx="10" class="blue"/><text x="437" y="190" class="small" text-anchor="middle">decide: sweep</text><text x="437" y="208" class="tiny" text-anchor="middle">RecordDecision(3)</text>
  <rect x="525" y="165" width="155" height="58" rx="10" class="green"/><text x="602" y="186" class="small" text-anchor="middle">tool: wire £2M</text><text x="602" y="202" class="tiny" text-anchor="middle">BeginEffect(4)=pending</text><text x="602" y="218" class="tiny" text-anchor="middle">bank.wire(…, key)→ ok</text>
  <rect x="700" y="165" width="155" height="58" rx="10" class="red"/><text x="777" y="186" class="small" text-anchor="middle" fill="#8A3C3C">✗ kill -9</text><text x="777" y="204" class="tiny" text-anchor="middle">before CompleteEffect(4)</text><text x="777" y="220" class="tiny" text-anchor="middle">or before GL post</text>

  <path d="M195,194 L215,194" class="line"/><path d="M350,194 L370,194" class="line"/><path d="M505,194 L525,194" class="line"/><path d="M680,194 L700,194" class="line-red"/>

  <!-- in postgres -->
  <rect x="60" y="260" width="795" height="64" rx="12" class="soft"/>
  <text x="80" y="285" class="label">…what's in Postgres after the crash</text>
  <text x="80" y="308" class="mono">tape_decisions: [1, 3]   ·   tape_effects: [2 confirmed, 4 pending]   ·   tape_budget: spent so far   ·   run: status=runnable, stale lease</text>

  <!-- recovery -->
  <rect x="900" y="160" width="240" height="68" rx="12" class="amber"/>
  <text x="1020" y="186" class="label" text-anchor="middle">recovery loop / webhook</text>
  <text x="1020" y="208" class="small" text-anchor="middle">runner.run(invocation_id = …)</text>
  <text x="1020" y="222" class="tiny" text-anchor="middle">reconciler first resolves effect 4</text>
  <path d="M855,290 C 1010,290 1020,260 1020,228" class="dash"/>

  <!-- run 2 -->
  <text x="60" y="375" class="label">Run 2 — ADK re-drives the same agent</text>
  <rect x="60" y="390" width="135" height="58" rx="10" class="box"/><text x="127" y="412" class="small" text-anchor="middle">decide: plan</text><text x="127" y="430" class="tiny" text-anchor="middle">GetDecision(1) → replay</text>
  <rect x="215" y="390" width="135" height="58" rx="10" class="box"/><text x="282" y="412" class="small" text-anchor="middle">tool: read</text><text x="282" y="430" class="tiny" text-anchor="middle">GetEffect(2) → recorded</text>
  <rect x="370" y="390" width="135" height="58" rx="10" class="box"/><text x="437" y="412" class="small" text-anchor="middle">decide: sweep</text><text x="437" y="430" class="tiny" text-anchor="middle">GetDecision(3) → replay</text>
  <rect x="525" y="390" width="155" height="58" rx="10" class="green"/><text x="602" y="408" class="small" text-anchor="middle">tool: wire £2M</text><text x="602" y="424" class="tiny" text-anchor="middle">effect 4 = confirmed</text><text x="602" y="440" class="tiny" text-anchor="middle">→ no second wire</text>
  <rect x="700" y="390" width="155" height="58" rx="10" class="red"/><text x="777" y="408" class="small" text-anchor="middle" fill="#8A3C3C">tool: post GL</text><text x="777" y="424" class="tiny" text-anchor="middle" fill="#8A3C3C">no record → runs for real</text><text x="777" y="440" class="tiny" text-anchor="middle" fill="#8A3C3C">← resume point</text>
  <rect x="875" y="390" width="135" height="58" rx="10" class="box"/><text x="942" y="412" class="small" text-anchor="middle">decide: done</text><text x="942" y="430" class="tiny" text-anchor="middle">EndRun → terminal</text>

  <path d="M195,419 L215,419" class="line"/><path d="M350,419 L370,419" class="line"/><path d="M505,419 L525,419" class="line"/><path d="M680,419 L700,419" class="line-red"/><path d="M855,419 L875,419" class="line"/>

  <rect x="230" y="500" width="740" height="48" rx="12" class="soft"/>
  <text x="600" y="530" class="label" text-anchor="middle">The day's book closes once. The crash left a pending row, not a half-finished world.</text>
</svg>
