<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title>The Idempotency Gap</title>
  <desc>The Idempotency Gap — diagram for durable agent execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1f1f1f" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#486A8F" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8A3C3C" />
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px ui-serif, Georgia, serif; fill: #1f1f1f; }
      .subtitle { font: 400 18px ui-serif, Georgia, serif; fill: #686868; }
      .label { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
      .small { font: 400 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
      .tiny { font: 400 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #686868; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f1f1f; }
      .box { fill: #fffefa; stroke: #1f1f1f; stroke-width: 1.6; rx: 18; }
      .soft { fill: #EAE7DF; stroke: #1f1f1f; stroke-width: 1.3; rx: 16; }
      .blue { fill: #E8EEF5; stroke: #486A8F; stroke-width: 1.7; rx: 18; }
      .amber { fill: #F4E7D8; stroke: #A36A28; stroke-width: 1.7; rx: 18; }
      .red { fill: #F2DEDE; stroke: #8A3C3C; stroke-width: 1.7; rx: 18; }
      .green { fill: #E5EFE8; stroke: #4E745B; stroke-width: 1.7; rx: 18; }
      .line { stroke: #1f1f1f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-blue { stroke: #486A8F; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #8A3C3C; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #686868; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; }
      .thin { stroke: #686868; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="675"/>
<text x="60" y="68" class="title" text-anchor="start">The Idempotency Gap</text>
<text x="60" y="100" class="subtitle" text-anchor="start">The merchant keeps one half of the books. The agent needs the other half.</text>
<rect x="90" y="170" width="390" height="390" class="blue"/>
<text x="285" y="210" class="label" text-anchor="middle">Agent ledger</text>
<text x="285" y="236" class="tiny" text-anchor="middle">protects the user’s workflow</text>
<rect x="135" y="285" width="300" height="70" class="box"/>
<text x="285" y="314" class="mono" text-anchor="middle">workflow_id = W</text>
<text x="285" y="338" class="tiny" text-anchor="middle">step = authorize</text>
<rect x="135" y="390" width="300" height="70" class="red"/>
<text x="285" y="420" class="small" text-anchor="middle">crash before journal write</text>
<text x="285" y="444" class="tiny" text-anchor="middle">agent no longer knows</text>
<rect x="720" y="170" width="390" height="390" class="green"/>
<text x="915" y="210" class="label" text-anchor="middle">Merchant ledger</text>
<text x="915" y="236" class="tiny" text-anchor="middle">protects the merchant’s boundary</text>
<rect x="765" y="285" width="300" height="70" class="box"/>
<text x="915" y="314" class="mono" text-anchor="middle">key = W/authorize</text>
<text x="915" y="338" class="tiny" text-anchor="middle">request seen once</text>
<rect x="765" y="390" width="300" height="70" class="box"/>
<text x="915" y="420" class="small" text-anchor="middle">response stored remotely</text>
<text x="915" y="444" class="tiny" text-anchor="middle">not in agent memory</text>
<path d="M480,320 C570,270 650,270 720,320" class="line-blue"/>
<text x="600" y="284" class="tiny" text-anchor="middle">request</text>
<path d="M720,425 C620,485 555,485 480,425" class="line-red"/>
<text x="600" y="506" class="tiny" text-anchor="middle">response lost in crash</text>
<circle cx="600" cy="365" r="82" fill="#fffefa" stroke="#8A3C3C" stroke-width="2"/>
<text x="600" y="348" class="label" text-anchor="middle">uncertainty</text>
<text x="600" y="374" class="small" text-anchor="middle">made?</text>
<text x="600" y="397" class="small" text-anchor="middle">response lost?</text>
<text x="160" y="610" class="label" text-anchor="start">Two systems can be locally correct and globally ambiguous. The journal removes the ambiguity.</text>
</svg>
