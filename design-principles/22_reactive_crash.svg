<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title>The Reactive Seam</title>
  <desc>A sequence diagram: the trigger loop crashes between observing a state-key change and running the handler; without a durable cursor it drops or double-fires; with a durable change feed and an idempotent handler it recovers.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <style>
      .bg{fill:#fbfaf7}
      .title{font:700 32px ui-serif,Georgia,serif;fill:#1f1f1f}
      .subtitle{font:400 17px ui-serif,Georgia,serif;fill:#686868}
      .h{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .part{font:700 13.5px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .msg{font:400 12.5px ui-sans-serif,system-ui,sans-serif;fill:#303030}
      .note{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#404040}
      .pbox{fill:#fffefa;stroke:#1f1f1f;stroke-width:1.5;rx:10}
      .life{stroke:#b9b3a6;stroke-width:1.3;stroke-dasharray:4 4}
      .m{stroke:#1f1f1f;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .crash{stroke:#8A3C3C;stroke-width:2.8;fill:none}
      .band{fill:#F4E7D8;stroke:#A36A28;stroke-width:1.3;rx:7}
      .bad{fill:#F2DEDE;stroke:#8A3C3C;stroke-width:1.4;rx:8}
      .ok{fill:#E5EFE8;stroke:#4E745B;stroke-width:1.4;rx:8}
      .div{stroke:#d8d3c8;stroke-width:1.4}
      .soft{fill:#EAE7DF;stroke:#1f1f1f;stroke-width:1.2;rx:10}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="60" y="54" class="title">The Reactive Seam</text>
  <text x="60" y="82" class="subtitle">"On a state-key change, if a condition holds, fire the next node." The trigger loop crashed between observing and firing.</text>

  <!-- LEFT: no durable cursor -->
  <text x="60" y="118" class="h" fill="#8A3C3C">No durable cursor · fire-and-forget trigger</text>
  <rect x="60" y="130" width="150" height="36" class="pbox"/><text x="135" y="153" class="part" text-anchor="middle">state store</text>
  <rect x="270" y="130" width="150" height="36" class="pbox"/><text x="345" y="153" class="part" text-anchor="middle">trigger loop</text>
  <rect x="470" y="130" width="100" height="36" class="pbox"/><text x="520" y="153" class="part" text-anchor="middle">handler</text>
  <line x1="135" y1="166" x2="135" y2="500" class="life"/>
  <line x1="345" y1="166" x2="345" y2="500" class="life"/>
  <line x1="520" y1="166" x2="520" y2="500" class="life"/>
  <path d="M135,200 L343,200" class="m"/><text x="240" y="193" class="msg" text-anchor="middle">notify: state.x changed</text>
  <text x="345" y="232" class="note" text-anchor="middle">about to run the handler…</text>
  <path d="M250,255 L270,244 L290,261 L310,244 L330,261 L350,244 L370,261 L390,252" class="crash"/>
  <text x="345" y="282" class="msg" text-anchor="middle" fill="#8A3C3C" font-weight="700">✗ trigger loop crashes</text>
  <rect x="240" y="296" width="210" height="22" class="band"/><text x="345" y="312" class="msg" text-anchor="middle">…restart…</text>
  <path d="M135,345 L343,345" class="m"/><text x="240" y="338" class="msg" text-anchor="middle">re-read: x is still "changed"</text>
  <path d="M345,378 L518,378" class="m"/><text x="432" y="371" class="msg" text-anchor="middle">run handler</text>
  <rect x="60" y="410" width="510" height="74" class="bad"/>
  <text x="315" y="432" class="msg" text-anchor="middle" font-weight="700">DID IT RUN THE FIRST TIME?</text>
  <text x="315" y="452" class="msg" text-anchor="middle">no record → DOUBLE-FIRE</text>
  <text x="315" y="470" class="msg" text-anchor="middle">(or, if it relied on LISTEN/NOTIFY: the notification was dropped → NO-FIRE)</text>

  <line x1="600" y1="120" x2="600" y2="540" class="div"/>

  <!-- RIGHT: durable change feed + idempotent handler -->
  <text x="630" y="118" class="h" fill="#4E745B">Durable change feed (cursor) · idempotent handler</text>
  <rect x="630" y="130" width="180" height="36" class="pbox"/><text x="720" y="153" class="part" text-anchor="middle">change log + offsets</text>
  <rect x="860" y="130" width="150" height="36" class="pbox"/><text x="935" y="153" class="part" text-anchor="middle">poller / CDC</text>
  <rect x="1050" y="130" width="100" height="36" class="pbox"/><text x="1100" y="153" class="part" text-anchor="middle">handler</text>
  <line x1="720" y1="166" x2="720" y2="500" class="life"/>
  <line x1="935" y1="166" x2="935" y2="500" class="life"/>
  <line x1="1100" y1="166" x2="1100" y2="500" class="life"/>
  <path d="M720,200 L933,200" class="m"/><text x="826" y="193" class="msg" text-anchor="middle">events since offset O</text>
  <path d="M935,232 L1098,232" class="m"/><text x="1016" y="225" class="msg" text-anchor="middle">run (idempotent, keyed on event id)</text>
  <path d="M650,265 L670,254 L690,271 L710,254 L730,271 L750,254 L770,271 L790,262" class="crash"/>
  <text x="900" y="265" class="msg" fill="#8A3C3C" font-weight="700">✗ crash — offset not advanced</text>
  <rect x="700" y="280" width="270" height="22" class="band"/><text x="835" y="296" class="msg" text-anchor="middle">…restart…</text>
  <path d="M720,330 L933,330" class="m"/><text x="826" y="323" class="msg" text-anchor="middle">events since offset O (unchanged)</text>
  <path d="M935,362 L1098,362" class="m"/><text x="1016" y="355" class="msg" text-anchor="middle">run again — handler is idempotent → no double effect</text>
  <path d="M1098,395 L722,395" class="m"/><text x="910" y="388" class="msg" text-anchor="middle">done → advance offset to O+1</text>
  <rect x="630" y="420" width="520" height="64" class="ok"/>
  <text x="890" y="442" class="msg" text-anchor="middle" font-weight="700">exactly-once-effectively: outbox/CDC + cursor + idempotent handler</text>
  <text x="890" y="462" class="msg" text-anchor="middle">— which is durable execution, one layer down. Inngest has step.sleep</text>
  <text x="890" y="478" class="msg" text-anchor="middle">because Inngest is a durable engine with a reactive front end.</text>

  <rect x="200" y="555" width="800" height="40" class="soft"/><text x="600" y="581" class="h" text-anchor="middle">The seam didn't vanish. It moved — from "crashed mid-await" to "crashed mid-react."</text>
</svg>
