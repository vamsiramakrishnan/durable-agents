<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title>The Third Outcome, Resolved</title>
  <desc>A sequence diagram: a wire whose ack is lost is neither sent nor not-sent until the bank is queried; query with the same key, re-issue with the same key, a durable timer carries the wait.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1f1f1f"/></marker>
    <marker id="arrow-fade" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#cfc8b8"/></marker>
    <style>
      .bg{fill:#fbfaf7}
      .title{font:700 33px ui-serif,Georgia,serif;fill:#1f1f1f}
      .subtitle{font:400 17px ui-serif,Georgia,serif;fill:#686868}
      .part{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:#1f1f1f}
      .msg{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#303030}
      .note{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#404040}
      .pbox{fill:#fffefa;stroke:#1f1f1f;stroke-width:1.6;rx:12}
      .wbox{fill:#E8EEF5;stroke:#486A8F;stroke-width:1.8;rx:12}
      .life{stroke:#b9b3a6;stroke-width:1.4;stroke-dasharray:4 4}
      .m{stroke:#1f1f1f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .lost{stroke:#cfc8b8;stroke-width:2;fill:none;marker-end:url(#arrow-fade);stroke-dasharray:4 4}
      .timer{fill:#F4E7D8;stroke:#A36A28;stroke-width:1.5;rx:8}
      .loopbox{fill:none;stroke:#486A8F;stroke-width:1.6;stroke-dasharray:7 4;rx:10}
      .jnote{fill:#EAE7DF;stroke:#8a8a8a;stroke-width:1;rx:6}
      .ok{fill:#E5EFE8;stroke:#4E745B;stroke-width:1.4;rx:8}
      .soft{fill:#EAE7DF;stroke:#1f1f1f;stroke-width:1.2;rx:10}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="60" y="54" class="title">The Third Outcome, Resolved</text>
  <text x="60" y="82" class="subtitle">A lost ack is neither sent nor not-sent until the bank is asked. Query with the same key; re-issue with the same key.</text>

  <rect x="160" y="106" width="220" height="40" class="wbox"/><text x="270" y="131" class="part" text-anchor="middle">workflow</text>
  <rect x="820" y="106" width="200" height="40" class="pbox"/><text x="920" y="131" class="part" text-anchor="middle">bank</text>
  <line x1="270" y1="146" x2="270" y2="650" class="life"/>
  <line x1="920" y1="146" x2="920" y2="650" class="life"/>

  <path d="M270,185 L918,185" class="m"/><text x="594" y="178" class="msg" text-anchor="middle">wire $1.2M  (idempotency_key = K)</text>
  <path d="M918,218 L420,228" class="lost"/><text x="640" y="208" class="msg" text-anchor="middle">…ack lost in the network (the cutoff is 4 p.m. regardless)…</text>

  <rect x="120" y="244" width="420" height="26" class="jnote"/><text x="330" y="262" class="note" text-anchor="middle">journal ▸ status = UNKNOWN — record it; the day can't close on it</text>

  <rect x="160" y="282" width="280" height="30" class="timer"/><text x="300" y="302" class="msg" text-anchor="middle">workflow.sleep(5m) — durable; survives deploys</text>

  <!-- loop box -->
  <rect x="120" y="330" width="980" height="190" class="loopbox"/>
  <text x="140" y="350" class="msg" fill="#486A8F" font-weight="700">loop — until known</text>

  <path d="M270,380 L918,380" class="m"/><text x="594" y="373" class="msg" text-anchor="middle">query status (key = K)?</text>
  <path d="M918,413 L272,413" class="m"/><text x="594" y="406" class="msg" text-anchor="middle">"confirmed — wire 88f3"   …or…   "absent — never landed"</text>

  <path d="M270,452 L918,452" class="m" stroke-dasharray="6 4"/><text x="594" y="445" class="msg" text-anchor="middle">if absent → wire $1.2M (key = K) again — same key, provably safe</text>
  <path d="M918,485 L272,485" class="m" stroke-dasharray="6 4"/><text x="594" y="478" class="msg" text-anchor="middle">✓ wire 88f3</text>

  <rect x="160" y="496" width="300" height="22" class="ok"/><text x="310" y="512" class="note" text-anchor="middle">journal ▸ status = CONFIRMED (88f3)</text>

  <path d="M270,562 L600,562" class="m"/><text x="435" y="555" class="msg" text-anchor="middle">now: post GL · file the liquidity ratio · send the summary</text>

  <rect x="200" y="600" width="800" height="56" class="soft"/>
  <text x="600" y="623" class="part" text-anchor="middle">`unknown` is a state the journal must hold — not a developer error.</text>
  <text x="600" y="644" class="msg" text-anchor="middle">The end-to-end check is the bank; the durable timer carries the wait; the same key makes the re-issue safe.</text>
</svg>
