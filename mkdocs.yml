  - Get started:
      - Quickstart: quickstart.md
      - Local dev: local-dev.md
      - ADK on Tape: adk.md
  - Guides:
      - Non-idempotent upstreams: non-idempotent-upstreams.md
      - Reactors: reactors.md
      - Stores: stores.md
      - Observability: observability.md
      - Tenancy: tenancy.md
  - Deploy on GCP:
      - Cloud Run: gcp-cloud-run.md
      - GKE Autopilot: gcp-gke.md
  - SDK Reference:
      - reference/index.md
      - Python:
          - reference/python/index.md
          - durable_app: reference/python/durable.md
          - effect & outbox_tool: reference/python/effect.md
          - Connectors: reference/python/connectors.md
          - Reactors: reference/python/reactors.md
          - Observability: reference/python/obs.md
          - Tenancy: reference/python/tenancy.md
          - Client: reference/python/client.md
      - Go:
          - reference/go/index.md
          - Package reference: reference/go/api.md
      - TypeScript:
          - reference/typescript/index.md
          - Package reference: reference/typescript/api.md
      - Java:
          - reference/java/index.md
          - Javadoc: reference/java/javadoc.md
  - CLI Reference:
      - reference/cli/index.md
  - Design:
      - design/index.md
      - Treatise: design/agents-that-act-treatise.md
      - Tape spec: design/tape.md
      - Event bus: design/tape-event-bus.md
      - Parity matrix: design/parity.md
