site_name: Tape
site_description: A durable-execution substrate for ADK agents — journal, recover, dispatch exactly-once.
site_url: https://vamsiramakrishnan.github.io/durable-agents/
repo_url: https://github.com/vamsiramakrishnan/durable-agents
repo_name: vamsiramakrishnan/durable-agents
edit_uri: edit/main/tape/docs/
copyright: Apache-2.0 · the durable-agents authors

docs_dir: tape/docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/tape.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Header / chrome
    - announce.dismiss
    - header.autohide
    # Navigation
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    # Search
    - search.highlight
    - search.share
    - search.suggest
    # Table of contents
    - toc.follow
    # Content actions
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  icon:
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    view: material/eye-outline
    annotation: material/arrow-right-circle

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: ⌗
      title: On this page
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: vamsiramakrishnan
      repo: durable-agents
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [tape/sdk/python]
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google
            docstring_section_style: spacy
            members_order: source
            filters: ["!^_"]
            heading_level: 3
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            inherited_members: true
            line_length: 88

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vamsiramakrishnan/durable-agents
      name: durable-agents on GitHub
  status:
    new: New page
    deprecated: Deprecated
  generator: false

extra_css:
  - assets/extra.css

